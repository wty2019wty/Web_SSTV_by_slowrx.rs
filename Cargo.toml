# Web 端 SSTV 工具的工作区。
#
# - crates/slowrx：内联的 slowrx 解码核心（原为 fork 的 sstv-web 分支）。
#   内联是为了加入「渐进解码」实时逐行模式（见 crates/slowrx/src/decoder.rs）。
# - crates/slowrx-wasm：把 slowrx 解码核心包装成 WebAssembly（wasm-bindgen）。
[workspace]
resolver = "2"
members = ["crates/slowrx", "crates/slowrx-wasm"]

# 与方案文档附录 A 的基准配置保持一致，保证 wasm 产物尽可能小、尽可能快。
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# 体积收尾：wasm 不需要 panic 展开，去掉符号表。
panic = "abort"
strip = "symbols"

# 开发/测试构建下优化第三方依赖（rustfft 的 FFT 是绝对热点），
# 否则 debug 跑一张 PD120 要一分钟以上。
[profile.dev.package."*"]
opt-level = 3
